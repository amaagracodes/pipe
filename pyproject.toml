[project]
name = "pipe-broker"
version = "0.1.0"
description = "Atomic, data-in/data-out operations for multilingual translation and domain-expertise knowledge export."
authors = [{ name = "amaagracodes" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

# The core has zero runtime deps by design. The `api` extra pulls in the
# serving layer (FastAPI app + Jinja2 templating + uvicorn ASGI server) used
# to run pipe as an HTTP service (e.g. in a container on Cloud Run).
[project.optional-dependencies]
api = ["fastapi", "jinja2", "uvicorn"]
# The `llm` extra pulls in DSPy, which brings its own LiteLLM-based client.
# LiteLLM natively speaks OpenRouter via the ``openrouter/<model>`` prefix, so
# no separate HTTP client is needed. This backs pipe.lib.providers.openrouter.
# Kept optional so the pure ops/scoping engine installs without an LLM stack.
llm = ["dspy>=3.3,<4"]

[project.urls]
Repository = "https://github.com/amaagracodes/pipe"

# Dev-only tooling (uv reads this): tests + a local ASGI runner.
[dependency-groups]
dev = ["pytest>=8", "uvicorn>=0.30"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "pipe", from = "src" }]


[tool.pytest.ini_options]
# Do not write .pytest_cache or __pycache__ during test runs.
addopts = "-p no:cacheprovider"
