name: Deploy to Cloud Run

on:
  push:
    branches: [development]
  workflow_dispatch:

env:
  SERVICE: pipe-broker
  REGION: ${{ vars.GCP_REGION }}          # e.g. us-central1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Authenticate to Google Cloud. Provide EITHER:
      #   - secrets.GCP_SA_KEY  (a service-account JSON key), or
      #   - Workload Identity Federation (recommended; set workload_identity_provider)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Builds the container from the Dockerfile (via Cloud Build) and deploys.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source . \
            --allow-unauthenticated \
            --port 8080
