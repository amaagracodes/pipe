name: Deploy to Cloud Run

on:
  push:
    branches: [development]
  workflow_dispatch:

env:
  SERVICE: pipe-broker
  REGION: ${{ vars.GCP_REGION }}          # e.g. us-central1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

# Required for Workload Identity Federation (keyless auth via OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keyless auth: GitHub's OIDC token is exchanged for short-lived GCP
      # credentials via Workload Identity Federation. No service-account keys.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Builds the container from the Dockerfile (via Cloud Build) and deploys.
      # The OpenRouter key comes from the GitHub secret and is forwarded to the
      # running service as $OPENROUTER_API_KEY (how OpenRouterProvider reads it).
      - name: Deploy to Cloud Run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source . \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --set-env-vars OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
